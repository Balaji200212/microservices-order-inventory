
input {
  file {
    path => "/logs/order-service.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["order-service"]
  }

  file {
    path => "/logs/inventory-service.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    tags => ["inventory-service"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "spring-boot-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
