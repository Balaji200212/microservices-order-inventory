spring.application.name=apiGateway
server.port=8080
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false

# 1) Auto routes from Eureka:  /inventory-service/**  and  /order-service/**
#    e.g. http://localhost:8080/inventory-service/inventory/1001
spring.cloud.gateway.server.webflux.discovery.locator.enabled=true
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# 2) Clean explicit routes:  /inventory/**  and  /orders/**
#    e.g. http://localhost:8080/inventory/1001
spring.cloud.gateway.server.webflux.routes[0].id=inventory-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://inventory-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/inventory,/inventory/**

spring.cloud.gateway.server.webflux.routes[1].id=order-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://order-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/orders,/orders/**