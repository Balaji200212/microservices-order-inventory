spring.application.name=inventory-service
server.port=8082

# Local run (IntelliJ) -> localhost. Docker overrides via EUREKA_URL env var.
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
# Hostname other services use to call this one. Local -> localhost, Docker -> container/service name.
eureka.instance.hostname=${INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}

logging.file.name=logs/inventory-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/inventory-service-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
